<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CDRvetor AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101014;
      color: #f4f4f5;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(820px, 92vw);
      background: #18181f;
      border: 1px solid #2b2b35;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }
    p {
      color: #b8b8c3;
      line-height: 1.5;
    }
    .drop {
      border: 2px dashed #555567;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      margin: 24px 0;
      background: #131318;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      border: 1px solid #3a3a46;
      background: #111118;
      color: white;
      border-radius: 12px;
      padding: 12px;
    }
    .check {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #111118;
      border: 1px solid #3a3a46;
      border-radius: 12px;
      padding: 12px;
    }
    button, a.button {
      display: inline-block;
      background: #ffffff;
      color: #111;
      border: 0;
      border-radius: 14px;
      padding: 14px 22px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-top: 12px;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .preview {
      margin-top: 24px;
      display: grid;
      gap: 16px;
    }
    iframe {
      width: 100%;
      height: 420px;
      background: white;
      border: 0;
      border-radius: 18px;
    }
    .status {
      min-height: 24px;
      color: #d7d7df;
    }
    .badge {
      display: inline-block;
      background: #243f2e;
      color: #bdf7d0;
      border: 1px solid #3d7a51;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">V5 Profissional</span>
    <h1>CDRvetor AI</h1>
    <p>Envie uma imagem e baixe um SVG vetorizado com modos de qualidade e opção de fundo transparente.</p>

    <div class="drop">
      <strong>Selecione PNG, JPG, WEBP ou BMP</strong><br>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" />
    </div>

    <div class="controls">
      <div>
        <label for="quality">Qualidade</label>
        <select id="quality">
          <option value="economico">Econômico — SVG mais leve</option>
          <option value="balanceado" selected>Balanceado — recomendado</option>
          <option value="ultra">Ultra — mais detalhes</option>
        </select>
      </div>

      <div>
        <label>Fundo</label>
        <div class="check">
          <input id="transparent" type="checkbox" />
          <span>Remover fundo / SVG transparente</span>
        </div>
      </div>
    </div>

    <button id="btn">Vetorizar agora</button>
    <p class="status" id="status"></p>

    <div class="preview" id="preview" style="display:none">
      <h3>Prévia do SVG</h3>
      <iframe id="frame"></iframe>
      <a class="button" id="download" download="cdrvetor-ai.svg">Baixar SVG</a>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById("file");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");
    const frame = document.getElementById("frame");
    const download = document.getElementById("download");
    const quality = document.getElementById("quality");
    const transparent = document.getElementById("transparent");

    btn.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        statusEl.textContent = "Escolha uma imagem primeiro.";
        return;
      }

      btn.disabled = true;
      statusEl.textContent = "Vetorizando...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("quality", quality.value);
      formData.append("transparent", transparent.checked ? "true" : "false");

      try {
        const response = await fetch("/vectorize", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "Erro ao processar.");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        frame.src = url;
        download.href = url;
        preview.style.display = "grid";
        statusEl.textContent = "SVG pronto.";
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
